name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: jobs get read-only access unless they ask for more.
permissions:
  contents: read

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate, audit, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Placeholders: the build never connects to the database or Clerk.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      NEXT_MAPBOX_TOKEN: pk.ci-placeholder
      NEXT_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
      CLERK_SECRET_KEY: sk_test_ci-placeholder
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      # Actions are pinned to full commit SHAs so a moved tag can't inject code.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      # Reproducible install from the lockfile.
      - run: npm ci

      - name: Validate listing data
        run: npm run validate

      - name: Self-checks
        run: |
          node scripts/check-listing-input.js
          node scripts/check-geocode.js
          node scripts/check-search-filters.js
          node scripts/check-campuses.js

      # ponytail: report-only until we upgrade to Next 16 (all Next <16 carry an open advisory).
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      - run: npm run build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
